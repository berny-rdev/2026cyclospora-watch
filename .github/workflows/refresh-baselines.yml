name: Refresh external baselines (USDA ERS)

# Separate from the hourly "Update Cyclospora Watch Page" workflow on purpose.
# That one renders and publishes; this one only refreshes source data for
# review. It never commits to main - a baseline feeds straight into the
# signal_ratio denominator, so every change gets eyeballed in a PR first.

on:
  schedule:
    - cron: "0 6 1 * *"    # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}     # and on demand from the Actions tab

# Distinct group from the hourly workflow so the two never cancel each other.
# No cancel-in-progress: this runs monthly and should be left to finish.
concurrency:
  group: refresh-external-baselines
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # Deliberately minimal - this job needs two packages, not the thirteen
      # the rendering workflow installs. No pandoc, no ggplot2, no mapcan.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr2", "jsonlite"))'

      # The script exits non-zero on any unexpected upstream change - a moved
      # download link, a restructured CSV, a missing commodity row, or a value
      # that moved more than 3x since last time. A failure here should be read
      # as "ERS changed something, go look", not as a flaky job to re-run.
      - name: Refresh baselines from ERS
        run: Rscript scripts/refresh-external-baselines.R

      - name: Detect change
        id: diff
        run: |
          # --porcelain covers both "modified" and "not yet tracked".
          if [ -z "$(git status --porcelain -- baselines-external.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No change - ERS data is identical to the last run. This is the expected result most months; ERS updates these files roughly annually."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Baseline values changed" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff -- baselines-external.json >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/refresh-external-baselines"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Capture the diff before committing, for the PR body.
          git --no-pager diff -- baselines-external.json > /tmp/baseline.diff || true

          git checkout -B "$BRANCH"
          git add baselines-external.json
          git commit -m "Refresh external baselines from USDA ERS"
          git push --force-with-lease origin "$BRANCH"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' || true)"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open for $BRANCH - pushed an update to it."
            exit 0
          fi

          {
            echo "Automated monthly refresh of \`baselines-external.json\` from the"
            echo "[USDA ERS Food Availability (Per Capita) Data System](https://www.ers.usda.gov/data-products/food-availability-per-capita-data-system)."
            echo
            echo "**Review before merging.** These values are provenance for the"
            echo "\`baseline_commonness\` figures that sit in the denominator of every"
            echo "signal ratio, so a wrong number here would move the lead list."
            echo
            echo "Worth checking:"
            echo "- Did \`source_year\` advance? A new ERS release is the usual reason for a diff."
            echo "- Do any values move by more than a few percent? Small revisions are normal; large ones are not."
            echo "- Did any category flip between \`ers_exact_match\` and \`author_estimate\`?"
            echo
            echo "Note that nothing in the rendering pipeline reads this file yet -"
            echo "merging it changes source data only, not the published page."
            echo
            echo '<details><summary>Diff</summary>'
            echo
            echo '```diff'
            cat /tmp/baseline.diff
            echo '```'
            echo
            echo '</details>'
          } > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh external baselines from USDA ERS" \
            --body-file /tmp/pr-body.md
